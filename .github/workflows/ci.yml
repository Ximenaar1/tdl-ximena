name: ci
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Pruebas automaticas (pytest)
        run: python -m pytest -q
      - name: Puerta de calidad de datos (pipeline + esquema pandera sobre los datos reales)
        run: python -m pipeline.ejecutar
