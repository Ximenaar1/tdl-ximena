# Linter del proyecto (se corre en CI en cada push)
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "W"]

[lint.per-file-ignores]
# Plantillas de reportes en Markdown con tablas largas
"pipeline/ejecutar.py" = ["E501"]
"pipeline/plata_a_oro.py" = ["E501"]
"laboratorio/pronostico.py" = ["E501"]
# Notebook explicativo: las importaciones van despues de ubicar la raiz del repositorio
"docs/E1/limpieza.ipynb" = ["E402", "E501"]
